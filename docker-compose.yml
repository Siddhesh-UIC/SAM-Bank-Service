services:
  db:
    image: postgres:16-alpine
    container_name: sam-bank-db
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank123
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    container_name: sam-bank-api
    environment:
      DATABASE_URL: postgresql://bank:bank123@db:5432/bank
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
